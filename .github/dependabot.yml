# Dependency drift is a clock, not a mistake: the advisories that prompted this were a
# lockfile left behind by a range that already allowed the fix. Weekly, grouped, so a
# quiet week is one merge rather than a page of them.
version: 2
updates:
  - package-ecosystem: "npm"
    # One entry, and it is the root. This is a pnpm workspace, so the lockfile lives there
    # and an update from it rewrites apps/web/package.json and pnpm-lock.yaml together.
    # Listing "/apps/web" as well opened a second PR per dependency that edited the
    # manifest alone — there is no lockfile in that directory to update — and every one of
    # those failed `pnpm install --frozen-lockfile`, in CI and on Vercel alike.
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Routine churn, batched. Majors stay out of these on purpose — they are the ones
      # that change behaviour, and they deserve a PR and a read of their own.
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development:
        dependency-type: "development"
        update-types: ["minor", "patch"]
