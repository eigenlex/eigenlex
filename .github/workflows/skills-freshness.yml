name: Vendored skills freshness

# The Next.js skills under .claude/skills/ are copies of vercel/next.js@canary/skills.
# Nothing in the repo pulls on them, so they rot silently — this is the only thing that
# looks. Drift arrives as a PR to review rather than as a silent swap, which is the same
# bargain Dependabot makes for the npm deps.
#
# Off the hour on purpose: GitHub queues cron runs at :00 and delays them under load.
# GitHub also disables scheduled workflows after 60 days without repo activity, so a
# long-quiet repo stops checking; workflow_dispatch is the manual way back.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Only to dispatch pr.yml on the branch this opens — see the last step.
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BRANCH: chore/next-skills-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No pnpm install: the script is plain Node with no dependencies.
      - id: sync
        env:
          # Raises the API budget from 60/hour per IP to 1000, and the script needs one call.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'report<<REPORT'
            node scripts/sync-next-skills.mjs
            echo REPORT
          } >> "$GITHUB_OUTPUT"

      - id: drift
        run: |
          if [ -n "$(git status --porcelain .claude/skills)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # One long-lived branch, force-pushed: a second week of drift updates the open PR
      # instead of opening a rival one against the same files.
      - if: steps.drift.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.sync.outputs.report }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add -A .claude/skills
          git commit -m 'chore: update vendored Next.js skills from upstream' \
            -m "Synced by .github/workflows/skills-freshness.yml from vercel/next.js@canary/skills." \
            -m "$REPORT"
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title 'chore: update vendored Next.js skills from upstream' \
              --body "$(printf 'Upstream drift in the vendored skills. Reproduce locally with `pnpm skills:sync`.\n\n```\n%s\n```\n' "$REPORT")"
          fi

      # A push made with github.token raises no pull_request event, so pr.yml never runs
      # and the `check` status that branch protection requires never reports — the PR
      # would sit unmergeable. Dispatching pr.yml on the branch puts a `check` run on the
      # same head commit, which is what the rule reads. If it still does not report,
      # closing and reopening the PR by hand fires the events from a human actor.
      - if: steps.drift.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pr.yml --ref "$BRANCH"
